é au service de la fonction\",\"aboutAssortmentBody\":\"Avec un assortiment soigneusement composé et polyvalent, nous répondons à des besoins variés. Des sabots classiques pour un usage professionnel en cabinet, pharmacie ou soins aux élégantes pantoufles et chaussons confortables pour toute la famille : nos produits allient une semelle anatomique à un design moderne. Ils s'intègrent harmonieusement à chaque situation de vie et favorisent le bien-être quotidien à chaque pas.\",\"aboutPartnerTitle\":\"Votre partenaire suisse de confiance\",\"aboutPartnerBody1\":\"TrendSwiss GmbH se considère non seulement comme un commerçant, mais comme un partenaire à long terme. Grâce à notre lien direct avec les sites de production, nous pouvons agir avec flexibilité, garantir les normes de qualité les plus élevées et vous offrir en permanence un excellent rapport qualité-prix.\",\"aboutPartnerBody2\":\"Que vous soyez un revendeur souhaitant enrichir votre assortiment avec nos produits de qualité ou un client particulier à la recherche du compagnon idéal pour votre quotidien – le client et un service de premier ordre sont toujours au centre de nos préoccupations.\",\"aboutWhyTitle\":\"Pourquoi TrendSwiss ?\",\"aboutWhy1Title\":\"Collections exclusives :\",\"aboutWhy1Text\":\"Modèles soigneusement sélectionnés auprès de producteurs internationaux établis.\",\"aboutWhy2Title\":\"Design ergonomique :\",\"aboutWhy2Text\":\"Coupe anatomiquement étudiée pour une station debout et une marche sans fatigue au quotidien.\",\"aboutWhy3Title\":\"Matériaux naturels :\",\"aboutWhy3Text\":\"Cuir de haute qualité et composants respirants pour un climat agréable au pied.\",\"aboutWhy4Title\":\"Fiabilité suisse :\",\"aboutWhy4Text\":\"Service compétent, traitement simple et proximité client authentique.\",\"aboutClosingLine\":\"Avancez avec nous vers le succès et redécouvrez le confort.\",\"aboutFooterLine\":\"TrendSwiss GmbH – pas à pas vers un plus grand bien-être.\",\"contactTitle\":\"Contact\",
